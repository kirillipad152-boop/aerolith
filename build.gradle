plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.aerolith'
version = '0.4.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def neoVersion = '26.3.0.118'
neoForge {
    version = neoVersion

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            programArgument '--tests'
            programArgument 'aerolith:*'
            programArgument '--report'
            programArgument 'aerolith-gametest.xml'
        }
        configureEach {
            gameDirectory = project.file("run/$name")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'aerolith'
        }
    }

    mods {
        aerolith { sourceSet sourceSets.main }
    }
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def archName = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def os = osName.startsWith('linux') ? 'linux' :
         osName.startsWith('mac') ? 'macos' :
         osName.startsWith('windows') ? 'windows' : null
def arch = [amd64: 'x86_64', x86_64: 'x86_64', arm64: 'aarch64', aarch64: 'aarch64'][archName]
def rustAbi = [linux: 'unknown-linux-gnu', macos: 'apple-darwin', windows: 'pc-windows-msvc'][os]
if (rustAbi == null || arch == null) {
    throw new GradleException("Aerolith cannot build natives for $osName / $archName. Use a 64-bit x86 or ARM JDK on Linux (glibc), macOS, or Windows (MSVC).")
}

def rustTarget = "$arch-$rustAbi"
def nativeSources = layout.projectDirectory.dir('native')
def cargoDirectory = layout.buildDirectory.dir('cargo')
def libraryName = System.mapLibraryName('aerolith_physics')
def nativeLibrary = cargoDirectory.map { it.file("$rustTarget/release/$libraryName") }

def cargoBuild = tasks.register('cargoBuild', Exec) {
    workingDir nativeSources.asFile
    commandLine 'cargo', 'build', '--locked', '--release', '--lib',
            '--target', rustTarget, '--target-dir', cargoDirectory.get().asFile.absolutePath
    // shortcut: tracks native source changes, not toolchain changes; run clean after switching toolchains.
    inputs.files(fileTree(nativeSources) { exclude '**/target/**', '**/build/**' })
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(nativeLibrary)
    doLast {
        if (!nativeLibrary.get().asFile.isFile()) {
            throw new GradleException("Cargo did not produce $libraryName. Check that native/Cargo.toml declares the aerolith_physics cdylib.")
        }
    }
}

// A jar for players on Windows needs the Windows library too, whatever machine builds it: pass -PwindowsNatives (or set
// AEROLITH_WINDOWS_NATIVES=1) to cross-compile it with Zig (see tools/build_windows_native.sh). On Windows itself the
// ordinary build above already makes it. Every release jar is built this way.
def crossWindows = os != 'windows' && arch == 'x86_64' && (project.hasProperty('windowsNatives') || System.getenv('AEROLITH_WINDOWS_NATIVES') != null)
def windowsLibrary = cargoDirectory.map { it.file("x86_64-pc-windows-gnu/release/aerolith_physics.dll") }
def cargoBuildWindows = crossWindows ? tasks.register('cargoBuildWindows', Exec) {
    commandLine 'sh', layout.projectDirectory.file('tools/build_windows_native.sh').asFile.absolutePath,
            nativeSources.asFile.absolutePath, cargoDirectory.get().asFile.absolutePath
    inputs.files(fileTree(nativeSources) { exclude '**/target/**', '**/build/**' })
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(windowsLibrary)
    doLast {
        if (!windowsLibrary.get().asFile.isFile()) {
            throw new GradleException("Cargo did not produce aerolith_physics.dll for Windows.")
        }
    }
} : null

tasks.named('processResources', ProcessResources) {
    from(cargoBuild) { into "natives/$os-$arch" }
    if (cargoBuildWindows != null) from(cargoBuildWindows) { into 'natives/windows-x86_64' }
    def metadata = [modVersion: project.version, neoVersion: neoVersion]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}

tasks.named('test', Test) {
    exclude 'dev/aerolith/NativeSmoke.class'
}

def nativeSmoke = tasks.register('nativeSmoke', JavaExec) {
    mainClass = 'dev.aerolith.NativeSmoke'
    classpath(sourceSets.test.output, tasks.named('jar', Jar))
    jvmArgs '-Xcheck:jni', '--enable-native-access=ALL-UNNAMED'
}

tasks.named('check') { dependsOn nativeSmoke }
