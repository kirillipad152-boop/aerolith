[package]
name = "aerolith_physics"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "=0.22.4"
rustc-hash = "2"
rapier3d-f64 = { version = "=0.26.1", features = ["parallel", "simd-stable"] }

[profile.release]
lto = "fat"
codegen-units = 1

# Rapier with the changes listed in vendor/rapier3d-f64/AEROLITH.md.
[patch.crates-io]
rapier3d-f64 = { path = "vendor/rapier3d-f64" }
